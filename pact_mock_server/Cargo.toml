[package]
name = "pact_mock_server"
version = "2.2.5"
authors = ["Ronald Holshausen <ronald.holshausen@gmail.com>"]
edition = "2024"
description = "Pact-Rust support library that implements in process mock server"
homepage = "https://www.pact.io"
repository = "https://github.com/pact-foundation/pact-core-mock-server/tree/main/pact_mock_server"
readme = "README.md"
keywords = ["testing", "pact", "cdc", "mockserver"]
license = "MIT"
exclude = [
    "*.iml"
]

[features]
default = ["datetime", "xml", "plugins", "multipart", "tls", "form_urlencoded"]
datetime = ["pact_models/datetime", "pact-plugin-driver?/datetime", "pact_matching/datetime"] # Support for date/time matchers and expressions
xml = ["pact_models/xml", "pact-plugin-driver?/xml", "pact_matching/xml"] # support for matching XML documents
plugins = ["dep:pact-plugin-driver", "pact_matching/plugins"]
multipart = ["pact_matching/multipart"] # suport for MIME multipart bodies
tls = ["dep:rustls", "rustls-pemfile", "dep:rcgen", "dep:tokio-rustls"]
form_urlencoded = ["pact_models/form_urlencoded", "pact_matching/form_urlencoded"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures = "0.3.33"
hyper = { version = "1.11.0", features = ["full"] }
http-body-util = "0.1.4"
hyper-util = { version = "0.1.20", features = ["full"] }
itertools = "0.15.0"
lazy_static = "1.5.0"
maplit = "1.0.2"
pact_matching = { version =  "~2.0.9", default-features = false }
pact_models = { version = "~1.3.13", default-features = false }
pact-plugin-driver = { version = "~1.1.1", optional = true, default-features = false }
rcgen = {  version = "0.14.8", optional = true, default-features = false, features = ["pem", "crypto", "ring"] }
rustls = { version = "0.23.43", optional = true, default-features = false, features = ["ring"] }
rustls-pemfile = { version = "2.2.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["ring"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
env_logger = "0.11.11"
expectest = "0.12.0"
pretty_assertions = "1.4.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "http2", "rustls-no-provider", "form"] }
test-log = "0.2.21"
tokio-test = "0.4.5"
