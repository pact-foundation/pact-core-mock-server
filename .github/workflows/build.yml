name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ ubuntu-latest, windows-latest, macos-latest ]
        rust: [ stable ]
    env:
      pact_do_not_track: true
      AWS_LC_SYS_NO_ASM: 1
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install shared mime info DB
        if: runner.os == 'macOS'
        run: brew install shared-mime-info
      - name: Tests
        run: cargo test
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: 1
      - name: Build Components
        run: cargo build

  clippy:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy

  musl-build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          docker run --rm --user "$(id -u)":"$(id -g)" -v $(pwd):/workspace -w /workspace -t -e TZ=UTC -e NO_IP6=1 pactfoundation/rust-musl-build ./scripts/ci-musl-build.sh

  check-features:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: cargo check --no-default-features

  # MARK: Release dependencies

  # Runs on drafts: the bot opens release PRs as drafts, and the cheap
  # resolution check below must report on them. The full package step
  # skips drafts.
  release-deps:
    name: Release dependencies
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          build-warnings: warn
          cache: false

      # Packaging resolves the crate's siblings on crates.io, without the
      # workspace's path and patch overrides, so a requirement on an
      # unreleased sibling version fails here, in seconds, before any build.
      - name: Check workspace dependencies are released
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: cargo package -p "${HEAD_REF#release/}" --locked --no-verify

      # Builds the crate as crates.io will, against those released versions.
      # A crate using a sibling's unreleased code fails here, not after its
      # tag.
      - name: Package against released dependencies
        if: ${{ !github.event.pull_request.draft }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: cargo package -p "${HEAD_REF#release/}" --locked
