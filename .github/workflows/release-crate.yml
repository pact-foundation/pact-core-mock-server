---
name: Release crate

on:
  push:
    tags:
      - 'libpact_mock_server-v*'

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          source .github/scripts/release-tags.sh
          crate=$(tag_crate "$TAG")
          version=$(tag_version "$TAG")
          .github/scripts/changelog-section.sh "$crate/CHANGELOG.md" "$version" > "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$(.github/scripts/release-title.sh "$TAG")" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
